name: ColorSense Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          npm install @faker-js/faker
          npm install uniqolor

      - name: Run ColorSense test
        run: bash test.sh
