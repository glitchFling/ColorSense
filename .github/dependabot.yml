version: 2
updates:
  # 1. Track your npm packages (like wrangler, Node packages, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor/patch updates together to reduce noise
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # 2. Track your GitHub Actions CI/CD workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
